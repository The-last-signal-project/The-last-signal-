name: AI Fix

on:
  workflow_call:
    inputs:
      error-artifact:
        description: "Nom de l'artifact contenant l'erreur"
        required: true
        type: string

      command:
        description: "Commande qui a échoué"
        required: true
        type: string

      working-directory:
        description: "Répertoire de travail"
        required: false
        type: string
        default: "server_rust"

permissions:
  contents: read

jobs:
  analyze:
    name: AI Fix Rust
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true"
      MODEL_PATH: "/home/runner/models/qwen.gguf"

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================================
      # DOWNLOAD ERROR ARTIFACT
      # ==========================================================

      - name: Download error artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.error-artifact }}
          path: ai-input

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            jq \
            patch

      # ==========================================================
      # CACHE LLAMA.CPP
      # ==========================================================

      - name: Cache llama.cpp
        id: cache-llama
        uses: actions/cache@v6
        with:
          path: /home/runner/llama.cpp
          key: llama-cpp-${{ runner.os }}-v2

      # ==========================================================
      # INSTALL LLAMA.CPP
      # ==========================================================

      - name: Install llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          LLAMA_DIR="$HOME/llama.cpp"
          LLAMA_CLI="$LLAMA_DIR/build/bin/llama-cli"

          if [ ! -x "$LLAMA_CLI" ]; then

            echo "================================================"
            echo "CLONAGE DE LLAMA.CPP"
            echo "================================================"

            rm -rf "$LLAMA_DIR"

            git clone \
              --depth 1 \
              https://github.com/ggml-org/llama.cpp.git \
              "$LLAMA_DIR"

            echo
            echo "================================================"
            echo "COMPILATION DE LLAMA-CLI"
            echo "================================================"

            cmake \
              -S "$LLAMA_DIR" \
              -B "$LLAMA_DIR/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=OFF

            cmake \
              --build "$LLAMA_DIR/build" \
              --config Release \
              --target llama-cli \
              --parallel "$(nproc)"

          else

            echo "llama.cpp trouvé dans le cache."

          fi

          if [ ! -x "$LLAMA_CLI" ]; then

            echo "❌ llama-cli introuvable."

            find "$LLAMA_DIR/build" \
              -type f \
              -name 'llama-cli*' \
              -print || true

            exit 1

          fi

          echo "LLAMA_CLI=$LLAMA_CLI" >> "$GITHUB_ENV"

          echo
          echo "================================================"
          echo "VERSION LLAMA.CPP"
          echo "================================================"

          "$LLAMA_CLI" --version

          echo
          echo "================================================"
          echo "OPTIONS LLAMA-CLI"
          echo "================================================"

          "$LLAMA_CLI" --help > "$GITHUB_WORKSPACE/ai-results-llama-help.txt" 2>&1 || true

          cat "$GITHUB_WORKSPACE/ai-results-llama-help.txt"

      # ==========================================================
      # CACHE MODEL
      # ==========================================================

      - name: Cache model
        uses: actions/cache@v6
        with:
          path: /home/runner/models
          key: llm-model-qwen25-coder-1.5b-q4km-v1

      # ==========================================================
      # DOWNLOAD MODEL
      # ==========================================================

      - name: Download coding model
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$MODEL_PATH")"

          if [ -s "$MODEL_PATH" ]; then

            echo "Modèle trouvé dans le cache."

          else

            echo "Téléchargement du modèle..."

            curl \
              -fL \
              --retry 3 \
              --retry-all-errors \
              "$MODEL_URL" \
              -o "$MODEL_PATH"

          fi

          echo
          echo "================================================"
          echo "MODÈLE"
          echo "================================================"

          ls -lh "$MODEL_PATH"

      # ==========================================================
      # AI REPAIR LOOP
      # ==========================================================

      - name: AI repair loop
        env:
          AI_COMMAND: ${{ inputs.command }}
          AI_WORKDIR: ${{ inputs.working-directory }}

        shell: bash

        run: |
          set -euo pipefail

          mkdir -p ai-results

          chmod +x "$LLAMA_CLI"

          echo "================================================"
          echo "AI RUST REPAIR"
          echo "================================================"

          echo "Repository : $GITHUB_WORKSPACE"
          echo "Working directory : $AI_WORKDIR"
          echo "Command : $AI_COMMAND"

          # ------------------------------------------------------
          # Vérification du working directory
          # ------------------------------------------------------

          if [ ! -d "$AI_WORKDIR" ]; then

            echo "❌ Répertoire inexistant : $AI_WORKDIR"
            exit 1

          fi

          # ------------------------------------------------------
          # Vérification de llama-cli
          # ------------------------------------------------------

          "$LLAMA_CLI" --version

          # ------------------------------------------------------
          # Recherche du fichier d'erreur
          # ------------------------------------------------------

          ERROR_FILE=$(find ai-input -type f -print -quit || true)

          if [ -z "$ERROR_FILE" ]; then

            echo "❌ Aucun fichier d'erreur trouvé."

            find ai-input \
              -maxdepth 5 \
              -type f \
              -print || true

            exit 1

          fi

          echo
          echo "Fichier d'erreur : $ERROR_FILE"

          # ------------------------------------------------------
          # Sauvegarde du log original
          # ------------------------------------------------------

          cp \
            "$ERROR_FILE" \
            ai-results/original-error.log

          # ------------------------------------------------------
          # Variables
          # ------------------------------------------------------

          MAX_ATTEMPTS=6
          SUCCESS=0

          # ------------------------------------------------------
          # Fonction : compter les erreurs
          # ------------------------------------------------------

          count_errors() {

            local file="$1"

            grep -Ec \
              '^error(\[[A-Z][0-9]+\])?:' \
              "$file" \
              || true
          }

          # ------------------------------------------------------
          # Fonction : construire un contexte d'erreur propre
          # ------------------------------------------------------

          build_error_context() {

            local file="$1"
            local output="$2"

            {

              echo "===== COMMAND ====="
              echo "$AI_COMMAND"

              echo
              echo "===== WORKING DIRECTORY ====="
              echo "$AI_WORKDIR"

              echo
              echo "===== COMPILER DIAGNOSTICS ====="

              # Priorité aux vrais diagnostics Rust.
              grep -E \
                '^(error(\[[A-Z][0-9]+\])?:|warning:|[[:space:]]*-->)' \
                "$file" \
                | head -n 160 \
                || true

              echo
              echo "===== LAST BUILD OUTPUT ====="

              tail -n 250 "$file"

            } > "$output"
          }

          # ------------------------------------------------------
          # Fonction : extraire les fichiers Rust mentionnés
          # ------------------------------------------------------

          extract_source_files() {

            local file="$1"

            grep -oE \
              '(server_rust/)?[A-Za-z0-9_./-]+\.rs' \
              "$file" \
              | sed 's/:.*$//' \
              | sort -u \
              | head -n 8 \
              || true
          }

          # ------------------------------------------------------
          # Fonction : résoudre un fichier Rust
          # ------------------------------------------------------

          resolve_source_file() {

            local file="$1"

            # Chemin déjà relatif à la racine du dépôt.
            if [ -f "$file" ]; then
              echo "$file"
              return 0
            fi

            # Chemin relatif au working directory.
            if [ -f "$AI_WORKDIR/$file" ]; then
              echo "$AI_WORKDIR/$file"
              return 0
            fi

            # Le compilateur peut avoir fourni un chemin sans
            # le préfixe server_rust/.
            if [[ "$file" == server_rust/* ]]; then

              local stripped="${file#server_rust/}"

              if [ -f "$AI_WORKDIR/$stripped" ]; then
                echo "$AI_WORKDIR/$stripped"
                return 0
              fi

            fi

            return 1
          }

          # ------------------------------------------------------
          # Nombre initial d'erreurs
          # ------------------------------------------------------

          PREV_ERRORS=$(count_errors "$ERROR_FILE")

          echo
          echo "Erreurs initiales : $PREV_ERRORS"

          # ------------------------------------------------------
          # Boucle principale
          # ------------------------------------------------------

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do

            echo
            echo "================================================"
            echo "AI FIX - TENTATIVE $ATTEMPT/$MAX_ATTEMPTS"
            echo "================================================"

            # ----------------------------------------------------
            # Nettoyage des fichiers temporaires
            # ----------------------------------------------------

            rm -f \
              ai.patch \
              ai-prompt.txt \
              ai-system.txt \
              ai-results/current-error-context.txt

            # ----------------------------------------------------
            # Construire contexte
            # ----------------------------------------------------

            build_error_context \
              "$ERROR_FILE" \
              ai-results/current-error-context.txt

            # ----------------------------------------------------
            # Construire system prompt
            # ----------------------------------------------------

            cat > ai-system.txt <<'EOF'
You are an autonomous Rust compiler-error fixing agent.

Your ONLY task is to fix the Rust compiler errors provided by the user.

The repository root is the current working directory.

The Rust crate is inside the configured working directory.

The compiler diagnostics are authoritative.

You MUST reason from the actual compiler diagnostics and source code.
Do not guess.

STRICT RULES:

1. Return ONLY the requested patch.
2. Never explain the solution.
3. Never output Markdown.
4. Never output code fences.
5. Never output reasoning.
6. Never output text before PATCH_BEGIN.
7. Never output text after PATCH_END.
8. The patch MUST be a valid unified Git diff.
9. Every path in the patch MUST be relative to the repository root.
10. Rust files inside the crate MUST therefore use paths such as:
    server_rust/src/example.rs
11. Modify only files directly related to the compiler error.
12. Make the smallest possible change.
13. Do not refactor unrelated code.
14. Do not change package versions.
15. Do not modify Cargo.lock.
16. Do not add dependencies.
17. Do not remove dependencies.
18. Do not modify Cargo.toml.
19. Do not invent files.
20. Do not invent variables.
21. Do not invent functions.
22. Do not invent structs.
23. Do not invent modules.
24. Do not invent compiler diagnostics.
25. Do not "fix" warnings unless they are directly related to the compiler failure.
26. Preserve existing project architecture.
27. Preserve existing naming conventions.
28. Preserve existing behavior except where required to fix the compiler error.

IMPORTANT:

The repository may contain several source files.
Only modify files whose existing contents are provided or whose exact path is clearly identified by the compiler diagnostics.

If the compiler error can be fixed by changing an existing expression, type,
match arm, import, lifetime, borrow, ownership operation, or function call,
make only that minimal change.

OUTPUT FORMAT:

PATCH_BEGIN
diff --git a/server_rust/path/to/file.rs b/server_rust/path/to/file.rs
...
PATCH_END

If there is no safe fix that can be determined from the provided information,
return:

PATCH_BEGIN
PATCH_END
EOF

            # ----------------------------------------------------
            # Construire user prompt
            # ----------------------------------------------------

            {

              echo "COMMAND:"
              echo "$AI_COMMAND"

              echo
              echo "WORKING DIRECTORY:"
              echo "$AI_WORKDIR"

              echo
              echo "REPOSITORY ROOT:"
              echo "$GITHUB_WORKSPACE"

              echo
              echo "===== COMPILER ERROR CONTEXT ====="

              cat ai-results/current-error-context.txt

              echo
              echo "===== SOURCE FILES MENTIONED BY COMPILER ====="

              FOUND_FILES=0

              while IFS= read -r source_file; do

                [ -z "$source_file" ] && continue

                if resolved=$(resolve_source_file "$source_file"); then

                  FOUND_FILES=$((FOUND_FILES + 1))

                  echo
                  echo "===== FILE: $resolved ====="

                  # Limiter les fichiers énormes.
                  sed -n '1,700p' "$resolved"

                fi

              done < <(extract_source_files "$ERROR_FILE")

              # --------------------------------------------------
              # Si aucun fichier n'a été trouvé automatiquement,
              # fournir les principaux fichiers Rust du crate.
              # --------------------------------------------------

              if [ "$FOUND_FILES" -eq 0 ]; then

                echo
                echo "===== FALLBACK RUST FILES ====="

                find "$AI_WORKDIR/src" \
                  -type f \
                  -name '*.rs' \
                  -print \
                  | sort \
                  | head -n 5 \
                  | while IFS= read -r source_file; do

                      echo
                      echo "===== FILE: $source_file ====="

                      sed -n '1,500p' "$source_file"

                    done

              fi

              echo
              echo "===== PREVIOUS ATTEMPT INFORMATION ====="

              if [ "$ATTEMPT" -gt 1 ]; then

                echo "The previous attempt was rejected or did not fix cargo check."

                if [ -f "ai-results/cargo-check-$((ATTEMPT - 1)).txt" ]; then

                  echo
                  echo "===== PREVIOUS CARGO CHECK ====="

                  tail -n 220 \
                    "ai-results/cargo-check-$((ATTEMPT - 1)).txt"

                fi

                if [ -f "ai-results/apply-error-$((ATTEMPT - 1)).txt" ]; then

                  echo
                  echo "===== PREVIOUS PATCH APPLICATION ERROR ====="

                  cat \
                    "ai-results/apply-error-$((ATTEMPT - 1)).txt"

                fi

              fi

              echo
              echo "Return ONLY PATCH_BEGIN ... PATCH_END."

            } > ai-prompt.txt

            echo
            echo "Taille du system prompt :"
            wc -c ai-system.txt

            echo "Taille du user prompt :"
            wc -c ai-prompt.txt

            # ----------------------------------------------------
            # Température
            # ----------------------------------------------------

            TEMP=$(awk \
              -v a="$ATTEMPT" \
              'BEGIN {
                t = 0.10 + 0.05 * (a - 1)
                if (t > 0.35) t = 0.35
                printf "%.2f", t
              }')

            echo
            echo "Température : $TEMP"

            # ----------------------------------------------------
            # Appel llama.cpp
            #
            # IMPORTANT :
            # - single-turn évite le mode interactif
            # - simple-io est prévu pour les sous-processus
            # - system-prompt-file sépare le rôle système
            # - file fournit le prompt utilisateur
            # - no-show-timings évite de polluer stdout
            # - no-display-prompt évite de réimprimer le prompt
            # ----------------------------------------------------

            echo
            echo "================================================"
            echo "APPEL LLAMA.CPP"
            echo "================================================"

            if ! "$LLAMA_CLI" \
              -m "$MODEL_PATH" \
              --system-prompt-file ai-system.txt \
              -f ai-prompt.txt \
              -n 3072 \
              -c 16384 \
              --temp "$TEMP" \
              --seed "$ATTEMPT" \
              --threads "$(nproc)" \
              --single-turn \
              --simple-io \
              --no-display-prompt \
              --no-show-timings \
              --no-perf \
              --log-disable \
              < /dev/null \
              > "ai-results/model-output-$ATTEMPT.txt" \
              2> "ai-results/model-stderr-$ATTEMPT.txt"
            then

              echo "❌ llama-cli a échoué."

              echo
              echo "===== STDERR ====="

              tail -n 100 \
                "ai-results/model-stderr-$ATTEMPT.txt"

              continue

            fi

            # ----------------------------------------------------
            # Affichage réponse
            # ----------------------------------------------------

            echo
            echo "===== RÉPONSE DU MODÈLE ====="

            cat \
              "ai-results/model-output-$ATTEMPT.txt"

            # ----------------------------------------------------
            # EXTRACTION PATCH_BEGIN / PATCH_END
            # ----------------------------------------------------

            MODEL_OUTPUT="ai-results/model-output-$ATTEMPT.txt"

            BEGIN_COUNT=$(
              grep -c '^PATCH_BEGIN$' "$MODEL_OUTPUT" || true
            )

            END_COUNT=$(
              grep -c '^PATCH_END$' "$MODEL_OUTPUT" || true
            )

            echo
            echo "PATCH_BEGIN : $BEGIN_COUNT"
            echo "PATCH_END   : $END_COUNT"

            if [ "$BEGIN_COUNT" -ne 1 ] || [ "$END_COUNT" -ne 1 ]; then

              echo
              echo "❌ Format de réponse invalide."

              {
                echo
                echo "===== INVALID MODEL OUTPUT ====="
                cat "$MODEL_OUTPUT"

              } > "ai-results/invalid-output-$ATTEMPT.txt"

              {

                echo
                echo "===== PREVIOUS MODEL OUTPUT INVALID ====="
                echo "The model did not return exactly one PATCH_BEGIN and PATCH_END."

              } >> ai-results/current-error-context.txt

              ERROR_FILE="ai-results/current-error-context.txt"

              continue

            fi

            # ----------------------------------------------------
            # Extraction exacte entre les marqueurs
            # ----------------------------------------------------

            awk '
              BEGIN {
                inside = 0
              }

              /^PATCH_BEGIN$/ {
                inside = 1
                next
              }

              /^PATCH_END$/ {
                inside = 0
                exit
              }

              inside {
                print
              }
            ' "$MODEL_OUTPUT" > ai.patch

            # ----------------------------------------------------
            # Nettoyage CRLF
            # ----------------------------------------------------

            sed -i 's/\r$//' ai.patch

            # ----------------------------------------------------
            # Vérifier patch vide
            # ----------------------------------------------------

            if ! grep -q '^diff --git ' ai.patch; then

              echo
              echo "⚠️ Le modèle n'a proposé aucun patch."

              cp \
                ai.patch \
                "ai-results/patch-$ATTEMPT.patch"

              {
                echo
                echo "===== EMPTY PATCH ====="
                echo "The model returned no diff."

              } >> ai-results/current-error-context.txt

              ERROR_FILE="ai-results/current-error-context.txt"

              continue

            fi

            # ----------------------------------------------------
            # Vérification contamination
            # ----------------------------------------------------

            if grep -Eq \
              '^(<\|im_start\|>|<\|im_end\|>|\[ Prompt:|available commands:|Exiting\.|Loading model\.|>|PATCH_BEGIN|PATCH_END)' \
              ai.patch
            then

              echo
              echo "❌ Patch contaminé par la sortie llama-cli."

              cat ai.patch

              {
                echo
                echo "===== CONTAMINATED PATCH ====="
                echo "The generated patch contained CLI/chat output."

              } >> ai-results/current-error-context.txt

              ERROR_FILE="ai-results/current-error-context.txt"

              continue

            fi

            # ----------------------------------------------------
            # Le patch doit être un vrai diff Git
            # ----------------------------------------------------

            if ! head -n 1 ai.patch | grep -q '^diff --git '; then

              echo
              echo "❌ Le patch ne commence pas par diff --git."

              cat ai.patch

              continue

            fi

            # ----------------------------------------------------
            # Protection supplémentaire :
            # refuser Cargo.toml / Cargo.lock
            # ----------------------------------------------------

            if grep -E '^diff --git .* (Cargo\.toml|Cargo\.lock)$' ai.patch; then

              echo
              echo "❌ Le modèle tente de modifier Cargo.toml ou Cargo.lock."

              cp \
                ai.patch \
                "ai-results/rejected-manifest-patch-$ATTEMPT.patch"

              {

                echo
                echo "===== REJECTED PATCH ====="
                echo "Cargo.toml and Cargo.lock modifications are forbidden."

              } >> ai-results/current-error-context.txt

              ERROR_FILE="ai-results/current-error-context.txt"

              continue

            fi

            # ----------------------------------------------------
            # Protection :
            # aucun fichier hors du projet Rust
            # ----------------------------------------------------

            BAD_PATH=0

            while IFS= read -r diff_path; do

              case "$diff_path" in

                "$AI_WORKDIR/src/"*.rs)
                  ;;

                "$AI_WORKDIR/tests/"*.rs)
                  ;;

                "$AI_WORKDIR/benches/"*.rs)
                  ;;

                "$AI_WORKDIR/examples/"*.rs)
                  ;;

                *)
                  echo "❌ Fichier interdit dans le patch : $diff_path"
                  BAD_PATH=1
                  ;;

              esac

            done < <(
              grep '^diff --git ' ai.patch |
              sed -E 's#^diff --git a/(.*) b/(.*)$#\1#'
            )

            if [ "$BAD_PATH" -ne 0 ]; then

              echo
              echo "❌ Patch rejeté : fichier hors périmètre autorisé."

              cp \
                ai.patch \
                "ai-results/rejected-path-patch-$ATTEMPT.patch"

              {

                echo
                echo "===== REJECTED PATCH PATH ====="
                echo "The patch modified files outside the allowed Rust source directories."

              } >> ai-results/current-error-context.txt

              ERROR_FILE="ai-results/current-error-context.txt"

              continue

            fi

            # ----------------------------------------------------
            # Sauvegarde patch
            # ----------------------------------------------------

            cp \
              ai.patch \
              "ai-results/patch-$ATTEMPT.patch"

            echo
            echo "================================================"
            echo "PATCH PROPOSÉ"
            echo "================================================"

            cat ai.patch

            # ----------------------------------------------------
            # VALIDATION GIT
            # ----------------------------------------------------

            echo
            echo "================================================"
            echo "VALIDATION DU PATCH"
            echo "================================================"

            if ! git apply \
              --check \
              --recount \
              --ignore-whitespace \
              ai.patch \
              2> "ai-results/apply-error-$ATTEMPT.txt"
            then

              echo
              echo "❌ Patch invalide."

              cat \
                "ai-results/apply-error-$ATTEMPT.txt"

              {

                echo
                echo "===== PATCH APPLICATION ERROR ====="

                cat \
                  "ai-results/apply-error-$ATTEMPT.txt"

                echo
                echo "Generate a new patch that applies cleanly to the repository."

              } >> ai-results/current-error-context.txt

              ERROR_FILE="ai-results/current-error-context.txt"

              continue

            fi

            # ----------------------------------------------------
            # Application
            # ----------------------------------------------------

            git apply \
              --recount \
              --ignore-whitespace \
              ai.patch

            echo
            echo "===== FICHIERS MODIFIÉS ====="

            git status --short

            # ----------------------------------------------------
            # Vérification du périmètre après application
            # ----------------------------------------------------

            MODIFIED_FILES=$(git diff --name-only)

            BAD_MODIFICATION=0

            while IFS= read -r modified; do

              [ -z "$modified" ] && continue

              case "$modified" in

                "$AI_WORKDIR/src/"*.rs)
                  ;;

                "$AI_WORKDIR/tests/"*.rs)
                  ;;

                "$AI_WORKDIR/benches/"*.rs)
                  ;;

                "$AI_WORKDIR/examples/"*.rs)
                  ;;

                *)
                  echo "❌ Modification interdite détectée : $modified"
                  BAD_MODIFICATION=1
                  ;;

              esac

            done <<< "$MODIFIED_FILES"

            if [ "$BAD_MODIFICATION" -ne 0 ]; then

              echo
              echo "❌ Annulation du patch."

              git reset --hard HEAD

              continue

            fi

            # ----------------------------------------------------
            # CARGO CHECK
            # ----------------------------------------------------

            echo
            echo "================================================"
            echo "CARGO CHECK"
            echo "================================================"

            CHECK_FILE="$GITHUB_WORKSPACE/ai-results/cargo-check-$ATTEMPT.txt"

            if (
              cd "$AI_WORKDIR"
              cargo check
            ) > "$CHECK_FILE" 2>&1
            then

              echo
              echo "================================================"
              echo "✅ CORRECTION RÉUSSIE"
              echo "================================================"

              SUCCESS=1

              break

            fi

            # ----------------------------------------------------
            # Nouveau nombre d'erreurs
            # ----------------------------------------------------

            NEW_ERRORS=$(count_errors "$CHECK_FILE")

            echo
            echo "Anciennes erreurs : $PREV_ERRORS"
            echo "Nouvelles erreurs : $NEW_ERRORS"

            echo
            echo "===== CARGO CHECK ====="

            tail -n 180 "$CHECK_FILE"

            # ----------------------------------------------------
            # Si le nombre d'erreurs diminue :
            # conserver le patch et continuer.
            # ----------------------------------------------------

            if [ "$NEW_ERRORS" -lt "$PREV_ERRORS" ]; then

              echo
              echo "📉 Amélioration détectée."

              PREV_ERRORS="$NEW_ERRORS"

              ERROR_FILE="$CHECK_FILE"

              continue

            fi

            # ----------------------------------------------------
            # Même nombre ou plus d'erreurs :
            # rollback.
            # ----------------------------------------------------

            echo
            echo "↩️ Aucune amélioration détectée."

            git reset --hard HEAD

            # ----------------------------------------------------
            # Donner le résultat au modèle
            # ----------------------------------------------------

            {

              echo
              echo "===== PREVIOUS PATCH DID NOT IMPROVE CARGO CHECK ====="

              echo
              echo "Previous error count:"
              echo "$PREV_ERRORS"

              echo
              echo "New error count:"
              echo "$NEW_ERRORS"

              echo
              echo "The previous patch was reverted."

              echo
              echo "===== CARGO CHECK RESULT ====="

              tail -n 300 "$CHECK_FILE"

              echo
              echo "Generate a different minimal fix."

            } > ai-results/current-error-context.txt

            ERROR_FILE="ai-results/current-error-context.txt"

          done

          # ======================================================
          # FINAL RESULT
          # ======================================================

          echo
          echo "================================================"
          echo "RÉSULTAT FINAL"
          echo "================================================"

          if [ "$SUCCESS" -eq 1 ]; then

            echo "✅ AI FIX terminé avec succès."

          else

            echo "❌ AI FIX n'a pas réussi à corriger le projet."

          fi

          # ------------------------------------------------------
          # Sauvegarder le résultat
          # ------------------------------------------------------

          {

            echo "===== FINAL GIT DIFF ====="

            git diff

            echo
            echo "===== GIT STATUS ====="

            git status --short

            echo
            echo "===== FINAL CARGO CHECK STATUS ====="

            if [ "$SUCCESS" -eq 1 ]; then
              echo "SUCCESS"
            else
              echo "FAILED"
            fi

          } > ai-results/final-result.txt

          git diff > ai-results/final.patch

          # ------------------------------------------------------
          # Échec du workflow si aucune correction valide
          # ------------------------------------------------------

          if [ "$SUCCESS" -ne 1 ]; then
            exit 1
          fi

      # ==========================================================
      # UPLOAD RESULTS
      # ==========================================================

      - name: Upload AI results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-fix-results
          path: |
            ai-results/
            ai.patch
            ai-prompt.txt
            ai-system.txt
            ai-results-llama-help.txt
          if-no-files-found: warn
