name: AI Fix

on:
  workflow_call:
    inputs:
      error-artifact:
        description: "Nom de l'artifact contenant l'erreur"
        required: true
        type: string

      command:
        description: "Commande qui a échoué"
        required: true
        type: string

      working-directory:
        description: "Répertoire de travail"
        required: false
        type: string
        default: "server_rust"

permissions:
  contents: read

jobs:
  analyze:
    name: AI Fix Rust
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true"
      MODEL_PATH: "/home/runner/models/qwen.gguf"

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================================
      # ERROR ARTIFACT
      # ==========================================================

      - name: Download error artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.error-artifact }}
          path: ai-input

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            jq \
            patch \
            ca-certificates

      # ==========================================================
      # CACHE LLAMA.CPP
      # ==========================================================

      - name: Cache llama.cpp
        id: cache-llama
        uses: actions/cache@v6
        with:
          path: /home/runner/llama.cpp
          key: llama-cpp-${{ runner.os }}-v2

      # ==========================================================
      # INSTALL LLAMA.CPP
      # ==========================================================

      - name: Install llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          LLAMA_DIR="$HOME/llama.cpp"
          LLAMA_CLI="$LLAMA_DIR/build/bin/llama-cli"

          if [ ! -x "$LLAMA_CLI" ]; then
            echo "================================================"
            echo "CLONAGE DE LLAMA.CPP"
            echo "================================================"

            rm -rf "$LLAMA_DIR"

            git clone \
              --depth 1 \
              https://github.com/ggml-org/llama.cpp.git \
              "$LLAMA_DIR"

            echo
            echo "================================================"
            echo "COMPILATION DE LLAMA-CLI"
            echo "================================================"

            cmake \
              -S "$LLAMA_DIR" \
              -B "$LLAMA_DIR/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=OFF

            cmake \
              --build "$LLAMA_DIR/build" \
              --config Release \
              --target llama-cli \
              --parallel "$(nproc)"
          else
            echo "llama.cpp trouvé dans le cache."
          fi

          if [ ! -x "$LLAMA_CLI" ]; then
            echo "❌ llama-cli introuvable."

            find "$LLAMA_DIR/build" \
              -type f \
              -name 'llama-cli*' \
              -print || true

            exit 1
          fi

          echo "LLAMA_CLI=$LLAMA_CLI" >> "$GITHUB_ENV"

          echo
          echo "================================================"
          echo "VERSION LLAMA.CPP"
          echo "================================================"

          "$LLAMA_CLI" --version

          echo
          echo "================================================"
          echo "OPTIONS LLAMA-CLI"
          echo "================================================"

          "$LLAMA_CLI" --help > "$GITHUB_WORKSPACE/ai-results-llama-help.txt" 2>&1 || true

          grep -E \
            -- \
            '--single-turn|--simple-io|--no-show-timings|--no-display-prompt|--no-cnv|--no-conversation' \
            "$GITHUB_WORKSPACE/ai-results-llama-help.txt" \
            || true

      # ==========================================================
      # CACHE MODEL
      # ==========================================================

      - name: Cache model
        uses: actions/cache@v6
        with:
          path: /home/runner/models
          key: qwen25-coder-1.5b-q4km-v1

      # ==========================================================
      # DOWNLOAD MODEL
      # ==========================================================

      - name: Download coding model
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$MODEL_PATH")"

          if [ -s "$MODEL_PATH" ]; then
            echo "Modèle trouvé dans le cache."
          else
            echo "Téléchargement du modèle..."

            curl \
              -fL \
              --retry 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              "$MODEL_URL" \
              -o "$MODEL_PATH"
          fi

          echo
          echo "================================================"
          echo "MODÈLE"
          echo "================================================"

          ls -lh "$MODEL_PATH"

          if [ ! -s "$MODEL_PATH" ]; then
            echo "❌ Le modèle est vide."
            exit 1
          fi

      # ==========================================================
      # PREPARE RESULTS DIRECTORY
      # ==========================================================

      - name: Prepare AI directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            ai-results \
            ai-work

      # ==========================================================
      # AI REPAIR LOOP
      # ==========================================================

      - name: AI repair loop
        env:
          AI_COMMAND: ${{ inputs.command }}
          AI_WORKDIR: ${{ inputs.working-directory }}

        shell: bash

        run: |
          set -euo pipefail

          chmod +x "$LLAMA_CLI"

          echo
          echo "================================================"
          echo "AI FIX RUST"
          echo "================================================"

          echo "Commande : $AI_COMMAND"
          echo "Répertoire : $AI_WORKDIR"

          # ------------------------------------------------------
          # Recherche du fichier d'erreur
          # ------------------------------------------------------

          ERROR_FILE=""

          while IFS= read -r candidate; do
            if [ -f "$candidate" ]; then
              ERROR_FILE="$candidate"
              break
            fi
          done < <(
            find ai-input \
              -type f \
              -print \
              | sort
          )

          if [ -z "$ERROR_FILE" ]; then
            echo "❌ Aucun fichier d'erreur trouvé."

            find ai-input \
              -maxdepth 5 \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo
          echo "Fichier d'erreur : $ERROR_FILE"

          # ------------------------------------------------------
          # Variables
          # ------------------------------------------------------

          MAX_ATTEMPTS=6
          SUCCESS=0

          # ------------------------------------------------------
          # Fonction : compter les erreurs Rust
          # ------------------------------------------------------

          count_errors() {
            local file="$1"

            grep -Ec \
              '^error(\[[A-Z][0-9]+\])?:|^error:' \
              "$file" \
              || true
          }

          # ------------------------------------------------------
          # Fonction : construire un contexte d'erreur propre
          # ------------------------------------------------------

          build_error_context() {
            local input_file="$1"
            local output_file="$2"

            {
              echo "===== COMMAND ====="
              echo "$AI_COMMAND"

              echo
              echo "===== WORKING DIRECTORY ====="
              echo "$AI_WORKDIR"

              echo
              echo "===== RUST COMPILER DIAGNOSTICS ====="

              grep -E \
                '^(error(\[[A-Z][0-9]+\])?:|warning:|[[:space:]]*--> |[[:space:]]*[0-9]+[[:space:]]*\|)' \
                "$input_file" \
                | tail -n 250 \
                || true

              echo
              echo "===== LAST RAW LOG LINES ====="

              tail -n 150 "$input_file"

            } > "$output_file"
          }

          # ------------------------------------------------------
          # Fonction : extraire les fichiers Rust concernés
          # ------------------------------------------------------

          extract_source_files() {
            local file="$1"

            grep -oE \
              '(server_rust/)?[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*\.rs' \
              "$file" \
              | sed 's#^\./##' \
              | sort -u \
              | head -n 8
          }

          # ------------------------------------------------------
          # Fonction : résoudre un fichier
          # ------------------------------------------------------

          resolve_source_file() {
            local file="$1"

            file="${file#./}"

            if [ -f "$file" ]; then
              printf '%s\n' "$file"
              return 0
            fi

            if [[ "$file" == "$AI_WORKDIR/"* ]] &&
               [ -f "$file" ]; then
              printf '%s\n' "$file"
              return 0
            fi

            if [ -f "$AI_WORKDIR/$file" ]; then
              printf '%s\n' "$AI_WORKDIR/$file"
              return 0
            fi

            return 1
          }

          # ------------------------------------------------------
          # Fonction : ajouter le contexte source
          # ------------------------------------------------------

          append_source_context() {
            local error_file="$1"
            local prompt_file="$2"

            local source
            local resolved
            local count=0

            while IFS= read -r source; do

              [ -z "$source" ] && continue

              if resolved=$(resolve_source_file "$source"); then

                count=$((count + 1))

                {
                  echo
                  echo "===== SOURCE FILE $count ====="
                  echo "PATH: $resolved"
                  echo
                  echo "----- BEGIN SOURCE -----"

                  sed -n '1,700p' "$resolved"

                  echo
                  echo "----- END SOURCE -----"

                } >> "$prompt_file"

              fi

              if [ "$count" -ge 5 ]; then
                break
              fi

            done < <(
              extract_source_files "$error_file"
            )
          }

          # ------------------------------------------------------
          # Nombre initial d'erreurs
          # ------------------------------------------------------

          build_error_context \
            "$ERROR_FILE" \
            "ai-results/current-error-context.txt"

          PREV_ERRORS=$(count_errors "$ERROR_FILE")

          echo
          echo "Nombre initial d'erreurs : $PREV_ERRORS"

          # ------------------------------------------------------
          # Boucle principale
          # ------------------------------------------------------

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do

            echo
            echo "========================================"
            echo "AI FIX - TENTATIVE $ATTEMPT/$MAX_ATTEMPTS"
            echo "========================================"

            # ----------------------------------------------------
            # Contexte actuel
            # ----------------------------------------------------

            CURRENT_CONTEXT="ai-results/current-error-context.txt"

            if [ ! -s "$CURRENT_CONTEXT" ]; then
              build_error_context \
                "$ERROR_FILE" \
                "$CURRENT_CONTEXT"
            fi

            # ----------------------------------------------------
            # Prompt système
            # ----------------------------------------------------

            SYSTEM_PROMPT_FILE="ai-work/system-prompt-$ATTEMPT.txt"

            {
              echo "You are an autonomous Rust compiler-error fixing agent."
              echo
              echo "Your ONLY task is to fix the compiler errors provided by the user."
              echo
              echo "The repository root is the current working directory."
              echo "The Rust crate is located in: $AI_WORKDIR"
              echo
              echo "CRITICAL RULES:"
              echo
              echo "1. Compiler diagnostics are authoritative."
              echo "2. Fix ONLY the reported compiler errors."
              echo "3. Make the smallest possible change."
              echo "4. Do not invent files."
              echo "5. Do not invent variables."
              echo "6. Do not invent functions."
              echo "7. Do not invent structs."
              echo "8. Do not invent modules."
              echo "9. Do not change Cargo.toml package.version."
              echo "10. Do not add dependencies."
              echo "11. Do not remove dependencies."
              echo "12. Do not modify Cargo.lock."
              echo "13. Do not perform unrelated refactoring."
              echo "14. Do not rename public APIs unless the compiler error requires it."
              echo "15. Do not rewrite working code unnecessarily."
              echo "16. All paths in the patch MUST be relative to the repository root."
              echo "17. Rust files inside the crate MUST therefore use paths such as:"
              echo "    server_rust/src/network/handler.rs"
              echo
              echo "OUTPUT RULES:"
              echo
              echo "Return ONLY a unified Git diff."
              echo
              echo "The first line MUST begin with:"
              echo "diff --git "
              echo
              echo "Do not output Markdown."
              echo "Do not output code fences."
              echo "Do not output explanations."
              echo "Do not output analysis."
              echo "Do not output PATCH_BEGIN."
              echo "Do not output PATCH_END."
              echo "Do not output terminal commands."
              echo "Do not output llama.cpp messages."
              echo
              echo "If there is no safe fix, return an empty response."
              echo
              echo "The patch must be directly applicable with:"
              echo "git apply ai.patch"
            } > "$SYSTEM_PROMPT_FILE"

            # ----------------------------------------------------
            # Prompt utilisateur
            # ----------------------------------------------------

            PROMPT_FILE="ai-work/prompt-$ATTEMPT.txt"

            {
              echo "Fix the Rust compiler errors below."
              echo
              echo "COMMAND:"
              echo "$AI_COMMAND"
              echo
              echo "WORKING DIRECTORY:"
              echo "$AI_WORKDIR"
              echo
              echo "===== COMPILER CONTEXT ====="
              cat "$CURRENT_CONTEXT"
              echo
              echo "===== SOURCE FILES INVOLVED ====="
            } > "$PROMPT_FILE"

            append_source_context \
              "$ERROR_FILE" \
              "$PROMPT_FILE"

            echo
            echo "Taille du prompt :"

            wc -c \
              "$PROMPT_FILE" \
              "$SYSTEM_PROMPT_FILE"

            # ----------------------------------------------------
            # Température
            # ----------------------------------------------------

            TEMP=$(awk \
              -v a="$ATTEMPT" \
              'BEGIN {
                t = 0.10 + 0.10 * (a - 1)
                if (t > 0.60) {
                  t = 0.60
                }
                printf "%.2f", t
              }')

            echo
            echo "Température : $TEMP"

            # ----------------------------------------------------
            # Appel llama.cpp
            # ----------------------------------------------------

            MODEL_OUTPUT="ai-results/model-output-$ATTEMPT.txt"
            MODEL_STDERR="ai-results/model-stderr-$ATTEMPT.txt"

            echo
            echo "Appel de llama.cpp..."

            if ! "$LLAMA_CLI" \
              -m "$MODEL_PATH" \
              --system-prompt-file "$SYSTEM_PROMPT_FILE" \
              -f "$PROMPT_FILE" \
              -n 4096 \
              -c 16384 \
              --temp "$TEMP" \
              --seed "$ATTEMPT" \
              --threads "$(nproc)" \
              --single-turn \
              --simple-io \
              --no-display-prompt \
              --no-show-timings \
              --no-perf \
              < /dev/null \
              > "$MODEL_OUTPUT" \
              2> "$MODEL_STDERR"
            then

              echo "❌ llama-cli a échoué."

              tail -n 100 \
                "$MODEL_STDERR" \
                || true

              continue
            fi

            # ----------------------------------------------------
            # Nettoyage sortie modèle
            # ----------------------------------------------------

            sed -i 's/\r$//' "$MODEL_OUTPUT"

            echo
            echo "===== SORTIE DU MODÈLE ====="

            cat "$MODEL_OUTPUT"

            # ----------------------------------------------------
            # Extraction du diff
            # ----------------------------------------------------

            rm -f ai.patch

            awk '
              /^diff --git / {
                started = 1
              }

              started {
                if (
                  $0 ~ /^\[ Prompt:/ ||
                  $0 ~ /^Exiting\.\.\.$/ ||
                  $0 ~ /^available commands:/ ||
                  $0 ~ /^Loading model\./ ||
                  $0 ~ /^>$/ ||
                  $0 ~ /^> /
                ) {
                  next
                }

                print
              }
            ' "$MODEL_OUTPUT" > ai.patch

            sed -i \
              -e '/^```diff$/d' \
              -e '/^```$/d' \
              -e '/^\[ Prompt:/d' \
              -e '/^\[ Generation:/d' \
              -e '/^Exiting\.\.\.$/d' \
              -e '/^Loading model\.$/d' \
              -e '/^available commands:$/d' \
              -e '/^>$/d' \
              -e '/^> /d' \
              ai.patch

            # ----------------------------------------------------
            # Vérifier présence du diff
            # ----------------------------------------------------

            if ! grep -q '^diff --git ' ai.patch; then

              echo
              echo "❌ Aucun diff Git valide produit."

              {
                echo
                echo "===== INVALID MODEL OUTPUT ====="
                echo "Attempt: $ATTEMPT"
                echo "The model did not produce a valid unified Git diff."
                echo
                echo "Model output:"
                cat "$MODEL_OUTPUT"

              } > "ai-results/invalid-output-$ATTEMPT.txt"

              {
                echo
                echo "===== PREVIOUS MODEL OUTPUT INVALID ====="
                echo "The previous response did not contain a valid Git diff."
                echo "Return ONLY a unified Git diff."
              } >> "$CURRENT_CONTEXT"

              ERROR_FILE="$CURRENT_CONTEXT"

              continue
            fi

            # ----------------------------------------------------
            # Détection pollution llama-cli
            # ----------------------------------------------------

            if grep -Eq \
              '^\[ Prompt:|^\[ Generation:|^Exiting\.\.\.$|^available commands:|^Loading model\.|^> |^<\|im_start\|>|^<\|im_end\|>' \
              ai.patch
            then

              echo
              echo "❌ Le patch contient encore des éléments llama-cli."

              cat ai.patch

              {
                echo
                echo "===== CONTAMINATED MODEL OUTPUT ====="
                echo "The generated patch contained llama-cli console output."
                echo "Return only the Git diff."
              } >> "$CURRENT_CONTEXT"

              ERROR_FILE="$CURRENT_CONTEXT"

              continue
            fi

            # ----------------------------------------------------
            # Vérification format diff
            # ----------------------------------------------------

            if ! grep -qE '^--- ' ai.patch; then
              echo "❌ Le diff ne contient pas de ligne ---."
              continue
            fi

            if ! grep -qE '^\+\+\+ ' ai.patch; then
              echo "❌ Le diff ne contient pas de ligne +++."
              continue
            fi

            # ----------------------------------------------------
            # Interdire modifications dangereuses/inutiles
            # ----------------------------------------------------

            if grep -Eq \
              '^diff --git .*Cargo\.(toml|lock)|^--- .*Cargo\.(toml|lock)|^\+\+\+ .*Cargo\.(toml|lock)' \
              ai.patch
            then

              echo
              echo "❌ Le modèle tente de modifier Cargo.toml ou Cargo.lock."

              cat ai.patch

              {
                echo
                echo "===== FORBIDDEN CARGO FILE CHANGE ====="
                echo "The previous patch attempted to modify Cargo.toml or Cargo.lock."
                echo "This is forbidden."
                echo "Fix only the Rust source files involved in the compiler error."
              } >> "$CURRENT_CONTEXT"

              ERROR_FILE="$CURRENT_CONTEXT"

              continue
            fi

            # ----------------------------------------------------
            # Vérifier les chemins du diff
            # ----------------------------------------------------

            INVALID_PATH=0

            while IFS= read -r path; do

              case "$path" in
                /dev/null)
                  continue
                  ;;

                server_rust/*)
                  ;;

                *)
                  echo "❌ Chemin hors du crate : $path"
                  INVALID_PATH=1
                  ;;

              esac

            done < <(
              grep -E '^(---|\+\+\+) ' ai.patch \
                | sed -E 's#^(---|\+\+\+) a/##; s#^(---|\+\+\+) b/##' \
                | sed 's/[[:space:]].*$//' \
                | sort -u
            )

            if [ "$INVALID_PATH" -ne 0 ]; then

              {
                echo
                echo "===== INVALID PATCH PATH ====="
                echo "All modified files must be inside:"
                echo "$AI_WORKDIR/"
                echo "The previous patch used an invalid path."

              } >> "$CURRENT_CONTEXT"

              ERROR_FILE="$CURRENT_CONTEXT"

              continue
            fi

            # ----------------------------------------------------
            # Retour ligne final
            # ----------------------------------------------------

            printf '\n' >> ai.patch

            cp \
              ai.patch \
              "ai-results/patch-$ATTEMPT.patch"

            echo
            echo "===== PATCH PROPOSÉ ====="

            cat ai.patch

            # ----------------------------------------------------
            # Validation Git
            # ----------------------------------------------------

            echo
            echo "===== VALIDATION DU PATCH ====="

            if ! git apply \
              --check \
              --recount \
              --ignore-whitespace \
              ai.patch \
              > "ai-results/apply-check-$ATTEMPT.txt" \
              2>&1
            then

              echo "❌ Patch invalide."

              cat \
                "ai-results/apply-check-$ATTEMPT.txt"

              {
                echo
                echo "===== PATCH APPLICATION ERROR ====="
                cat "ai-results/apply-check-$ATTEMPT.txt"

              } >> "$CURRENT_CONTEXT"

              ERROR_FILE="$CURRENT_CONTEXT"

              continue
            fi

            # ----------------------------------------------------
            # Sauvegarde état avant patch
            # ----------------------------------------------------

            git diff \
              > "ai-results/before-patch-$ATTEMPT.patch"

            # ----------------------------------------------------
            # Application
            # ----------------------------------------------------

            git apply \
              --recount \
              --ignore-whitespace \
              ai.patch

            echo
            echo "===== FICHIERS MODIFIÉS ====="

            git status --short

            # ----------------------------------------------------
            # Cargo check
            # ----------------------------------------------------

            echo
            echo "===== CARGO CHECK ====="

            CHECK_FILE="$GITHUB_WORKSPACE/ai-results/cargo-check-$ATTEMPT.txt"

            if (
              cd "$AI_WORKDIR"
              cargo check
            ) > "$CHECK_FILE" 2>&1
            then

              echo
              echo "========================================"
              echo "✅ CORRECTION RÉUSSIE"
              echo "========================================"

              SUCCESS=1

              break

            fi

            # ----------------------------------------------------
            # Nouveau nombre d'erreurs
            # ----------------------------------------------------

            NEW_ERRORS=$(count_errors "$CHECK_FILE")

            echo
            echo "Anciennes erreurs : $PREV_ERRORS"
            echo "Nouvelles erreurs : $NEW_ERRORS"

            echo
            echo "===== FIN CARGO CHECK ====="

            tail -n 150 \
              "$CHECK_FILE"

            # ----------------------------------------------------
            # Si le nombre d'erreurs n'a pas baissé
            # ----------------------------------------------------

            if [ "$NEW_ERRORS" -ge "$PREV_ERRORS" ]; then

              echo
              echo "↩️ Pas d'amélioration."

              if ! git apply \
                -R \
                --recount \
                --ignore-whitespace \
                ai.patch
              then

                echo "⚠️ Impossible d'annuler proprement le patch."

                git checkout -- .
              fi

              {
                echo
                echo "===== PREVIOUS PATCH DID NOT IMPROVE CARGO CHECK ====="

                echo "Previous error count: $PREV_ERRORS"
                echo "New error count: $NEW_ERRORS"

                echo
                echo "===== CARGO CHECK RESULT ====="

                tail -n 250 "$CHECK_FILE"

                echo
                echo "===== PREVIOUS PATCH ====="

                cat ai.patch

              } > "$CURRENT_CONTEXT"

              ERROR_FILE="$CURRENT_CONTEXT"

            else

              echo
              echo "📉 Amélioration détectée."

              PREV_ERRORS="$NEW_ERRORS"

              ERROR_FILE="$CHECK_FILE"

              build_error_context \
                "$CHECK_FILE" \
                "$CURRENT_CONTEXT"

            fi

          done

          # ======================================================
          # FINAL RESULT
          # ======================================================

          echo
          echo "========================================"
          echo "RÉSULTAT FINAL"
          echo "========================================"

          if [ "$SUCCESS" -eq 1 ]; then

            echo "✅ AI FIX terminé avec succès."

          else

            echo "❌ AI FIX n'a pas réussi à corriger le projet."

          fi

          {
            echo "===== FINAL GIT DIFF ====="

            git diff

            echo
            echo "===== GIT STATUS ====="

            git status --short

            echo
            echo "===== FINAL ERROR COUNT ====="

            FINAL_ERRORS=$(
              count_errors "$ERROR_FILE"
            )

            echo "$FINAL_ERRORS"

          } > ai-results/final-result.txt

          git diff \
            > ai-results/final.patch

          if [ "$SUCCESS" -ne 1 ]; then
            exit 1
          fi

      # ==========================================================
      # UPLOAD RESULTS
      # ==========================================================

      - name: Upload AI results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-fix-results
          path: |
            ai-results/
            ai.patch
            ai-work/
            ai-results-llama-help.txt
          if-no-files-found: warn
