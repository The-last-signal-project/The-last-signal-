name: AI Fix

on:
  workflow_call:
    inputs:
      error-artifact:
        description: "Nom de l'artifact contenant l'erreur"
        required: true
        type: string

      command:
        description: "Commande qui a échoué"
        required: true
        type: string

      working-directory:
        description: "Répertoire de travail"
        required: false
        type: string
        default: "server_rust"

permissions:
  contents: read

jobs:
  analyze:
    name: AI Fix Rust
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf?download=true"
      MODEL_PATH: "/home/runner/models/qwen.gguf"

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ==========================================================
      # ERROR ARTIFACT
      # ==========================================================

      - name: Download error artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.error-artifact }}
          path: ai-input

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            curl \
            jq \
            patch

      # ==========================================================
      # CACHE LLAMA.CPP
      # ==========================================================

      - name: Cache llama.cpp
        id: cache-llama
        uses: actions/cache@v6
        with:
          path: /home/runner/llama.cpp
          key: llama-cpp-${{ runner.os }}-v1

      # ==========================================================
      # INSTALL LLAMA.CPP
      # ==========================================================

      - name: Install llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          LLAMA_DIR="$HOME/llama.cpp"

          if [ ! -x "$LLAMA_DIR/build/bin/llama-cli" ]; then
            echo "Clonage de llama.cpp..."

            rm -rf "$LLAMA_DIR"

            git clone \
              --depth 1 \
              https://github.com/ggml-org/llama.cpp.git \
              "$LLAMA_DIR"

            echo "Compilation de llama-cli..."

            cmake \
              -S "$LLAMA_DIR" \
              -B "$LLAMA_DIR/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=OFF

            cmake \
              --build "$LLAMA_DIR/build" \
              --config Release \
              --target llama-cli \
              --parallel "$(nproc)"
          else
            echo "llama.cpp trouvé dans le cache."
          fi

          LLAMA_CLI="$LLAMA_DIR/build/bin/llama-cli"

          if [ ! -x "$LLAMA_CLI" ]; then
            echo "❌ llama-cli introuvable."

            find "$LLAMA_DIR/build" \
              -type f \
              -name 'llama-cli*' \
              -print || true

            exit 1
          fi

          echo "LLAMA_CLI=$LLAMA_CLI" >> "$GITHUB_ENV"

          "$LLAMA_CLI" --version
          "$LLAMA_CLI" --help

      # ==========================================================
      # CACHE MODEL
      # ==========================================================

      - name: Cache model
        uses: actions/cache@v6
        with:
          path: /home/runner/models
          key: llm-model-${{ hashFiles('.github/workflows/ai-fix.yml') }}-${{ env.MODEL_URL }}

      # ==========================================================
      # DOWNLOAD MODEL
      # ==========================================================

      - name: Download coding model
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$MODEL_PATH")"

          if [ -s "$MODEL_PATH" ]; then
            echo "Modèle trouvé dans le cache."
          else
            echo "Téléchargement du modèle..."

            curl \
              -fL \
              --retry 3 \
              --retry-all-errors \
              "$MODEL_URL" \
              -o "$MODEL_PATH"
          fi

          ls -lh "$MODEL_PATH"

      # ==========================================================
      # AI REPAIR LOOP
      # ==========================================================

      - name: AI repair loop
        env:
          AI_COMMAND: ${{ inputs.command }}
          AI_WORKDIR: ${{ inputs.working-directory }}

        shell: bash

        run: |
          set -euo pipefail

          chmod +x "$LLAMA_CLI"

          echo "================================================"
          echo "LLAMA.CPP"
          echo "================================================"

          "$LLAMA_CLI" --version

          echo
          echo "================================================"
          echo "LLAMA CLI HELP"
          echo "================================================"

          "$LLAMA_CLI" --help > ai-results-llama-help.txt 2>&1 || true

          cat ai-results-llama-help.txt

          # ------------------------------------------------------
          # Recherche du fichier d'erreur
          # ------------------------------------------------------

          ERROR_FILE=$(find ai-input -type f -print -quit)

          if [ -z "$ERROR_FILE" ]; then
            echo "❌ Aucun fichier d'erreur trouvé."

            find ai-input \
              -maxdepth 3 \
              -type f \
              -print || true

            exit 1
          fi

          echo
          echo "Fichier d'erreur : $ERROR_FILE"

          mkdir -p ai-results

          # ------------------------------------------------------
          # Variables
          # ------------------------------------------------------

          MAX_ATTEMPTS=6
          SUCCESS=0

          # ------------------------------------------------------
          # Nombre initial d'erreurs
          # ------------------------------------------------------

          PREV_ERRORS=$(grep -Ec '^error(\[[A-Z][0-9]+\])?:|^error:' "$ERROR_FILE" || true)

          echo "Nombre initial d'erreurs : $PREV_ERRORS"

          # ------------------------------------------------------
          # Fonction : construire le contexte Cargo
          # ------------------------------------------------------

          build_error_context() {

            local file="$1"

            {
              echo "===== CARGO ERROR CONTEXT ====="

              # Les erreurs Rust importantes sont généralement
              # situées vers la fin de la sortie cargo check.
              tail -n 300 "$file"

            } > ai-results/current-error-context.txt
          }

          # ------------------------------------------------------
          # Fonction : extraire les fichiers Rust
          # ------------------------------------------------------

          extract_source_files() {

            local file="$1"

            grep -oE \
              '(server_rust/)?[A-Za-z0-9_./-]+\.rs' \
              "$file" \
              | sort -u \
              | head -n 5
          }

          # ------------------------------------------------------
          # Fonction : résoudre un chemin source
          # ------------------------------------------------------

          resolve_source_file() {

            local file="$1"

            if [ -f "$file" ]; then
              echo "$file"
              return 0
            fi

            if [[ "$file" == server_rust/* ]] &&
               [ -f "${file#server_rust/}" ]; then
              echo "${file#server_rust/}"
              return 0
            fi

            if [ -f "$AI_WORKDIR/$file" ]; then
              echo "$AI_WORKDIR/$file"
              return 0
            fi

            return 1
          }

          # ------------------------------------------------------
          # Fonction : compter les erreurs
          # ------------------------------------------------------

          count_errors() {

            local file="$1"

            grep -Ec \
              '^error(\[[A-Z][0-9]+\])?:|^error:' \
              "$file" \
              || true
          }

          # ------------------------------------------------------
          # Boucle principale
          # ------------------------------------------------------

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do

            echo
            echo "========================================"
            echo "AI FIX - TENTATIVE $ATTEMPT/$MAX_ATTEMPTS"
            echo "========================================"

            # ----------------------------------------------------
            # Construire contexte d'erreur
            # ----------------------------------------------------

            build_error_context "$ERROR_FILE"

            # ----------------------------------------------------
            # Construire prompt
            # ----------------------------------------------------

            {

              echo "<|im_start|>system"

              echo "You are an autonomous Rust debugging agent."

              echo "Your task is to fix the Rust cargo check failure."

              echo

              echo "IMPORTANT RULES:"

              echo "1. Work from the repository root."

              echo "2. The Rust crate is located in: $AI_WORKDIR"

              echo "3. Paths in the git diff MUST include '$AI_WORKDIR/' when the file is inside that directory."

              echo "4. Do not invent files."

              echo "5. Do not modify Cargo.lock unless absolutely necessary."

              echo "6. Make the smallest possible correction."

              echo "7. Do not change dependency versions unless the compiler error requires it."

              echo "8. Do not modify unrelated files."

              echo "9. Do not explain your answer."

              echo

              echo "OUTPUT FORMAT:"

              echo "You MUST output exactly one patch between these markers:"

              echo

              echo "PATCH_BEGIN"

              echo "diff --git a/server_rust/example.rs b/server_rust/example.rs"

              echo "..."

              echo "PATCH_END"

              echo

              echo "Nothing except the patch may appear between PATCH_BEGIN and PATCH_END."

              echo "If you cannot determine a valid fix, output an empty patch between the markers."

              echo

              echo "<|im_end|>"

              echo "<|im_start|>user"

              echo "COMMAND: $AI_COMMAND"

              echo "WORKING DIRECTORY: $AI_WORKDIR"

              echo

              echo "===== COMPILER ERROR ====="

              cat ai-results/current-error-context.txt

              echo

              echo "===== SOURCE FILES INVOLVED ====="

              extract_source_files "$ERROR_FILE" |
              while IFS= read -r f; do

                [ -z "$f" ] && continue

                if resolved=$(resolve_source_file "$f"); then

                  echo
                  echo "===== $resolved ====="

                  # Donner suffisamment de contexte au modèle
                  # sans envoyer des fichiers gigantesques.
                  sed -n '1,500p' "$resolved"

                fi

              done

              echo

              echo "<|im_end|>"

              echo "<|im_start|>assistant"

            } > ai-prompt.txt

            echo
            echo "Taille du prompt :"

            wc -c ai-prompt.txt

            # ----------------------------------------------------
            # Température
            # ----------------------------------------------------

            TEMP=$(awk \
              -v a="$ATTEMPT" \
              'BEGIN {
                t = 0.1 + 0.10 * (a - 1)
                if (t > 0.6) t = 0.6
                printf "%.2f", t
              }')

            echo
            echo "Température : $TEMP"

            # ----------------------------------------------------
            # Appel modèle
            # ----------------------------------------------------

            echo
            echo "Appel de llama.cpp..."

            CNV_FLAG=()
            if "$LLAMA_CLI" --help 2>&1 | grep -q -- '--no-cnv'; then
              CNV_FLAG=(--no-cnv)
            elif "$LLAMA_CLI" --help 2>&1 | grep -q -- '--no-conversation'; then
              CNV_FLAG=(--no-conversation)
            fi

            if ! "$LLAMA_CLI" \
              -m "$MODEL_PATH" \
              -f ai-prompt.txt \
              -n 4096 \
              -c 16384 \
              --temp "$TEMP" \
              --seed "$ATTEMPT" \
              --threads "$(nproc)" \
              "${CNV_FLAG[@]}" \
              --no-display-prompt \
              < /dev/null \
              > "ai-results/model-output-$ATTEMPT.txt" \
              2> "ai-results/model-stderr-$ATTEMPT.txt"
            then

              echo "❌ llama-cli a échoué."

              tail -n 50 \
                "ai-results/model-stderr-$ATTEMPT.txt"

              continue

            fi

            # ----------------------------------------------------
            # Affichage réponse
            # ----------------------------------------------------

            echo
            echo "===== RÉPONSE DU MODÈLE ====="

            cat \
              "ai-results/model-output-$ATTEMPT.txt"

            # ----------------------------------------------------
            # EXTRACTION STRICTE DU PATCH
            # ----------------------------------------------------

            MODEL_OUTPUT="ai-results/model-output-$ATTEMPT.txt"

            PATCH_BEGIN_COUNT=$(
              grep -c '^PATCH_BEGIN$' "$MODEL_OUTPUT" || true
            )

            PATCH_END_COUNT=$(
              grep -c '^PATCH_END$' "$MODEL_OUTPUT" || true
            )

            echo
            echo "PATCH_BEGIN : $PATCH_BEGIN_COUNT"
            echo "PATCH_END   : $PATCH_END_COUNT"

            if [ "$PATCH_BEGIN_COUNT" -eq 1 ] && [ "$PATCH_END_COUNT" -eq 1 ]; then

              sed \
                -n \
                '/^PATCH_BEGIN$/,/^PATCH_END$/p' \
                "$MODEL_OUTPUT" |
                sed \
                  '1d;$d' \
                > ai.patch

            elif grep -q '^diff --git ' "$MODEL_OUTPUT"; then

              echo "Model output without explicit markers; extracting raw diff..."

              awk '
                BEGIN { p = 0 }
                /^diff --git / { p = 1 }
                p { print }
              ' "$MODEL_OUTPUT" > ai.patch

            else

              echo "❌ Marqueurs PATCH_BEGIN/PATCH_END invalides et aucun diff --git détecté."

              {
                echo
                echo "===== PREVIOUS MODEL OUTPUT INVALID ====="
                echo "The previous response did not contain a valid patch block."
                echo "You MUST return either PATCH_BEGIN ... PATCH_END or a raw unified diff."
              } >> ai-results/current-error-context.txt

              ERROR_FILE="ai-results/current-error-context.txt"

              continue
            fi

            # ----------------------------------------------------
            # Nettoyage strict : ne garder que le diff réel
            # ----------------------------------------------------

            sed -i 's/\r$//' ai.patch
            sed -i '/^```/d' ai.patch
            sed -i '/^> $/d' ai.patch
            sed -i '/^> <|im_end|>$/d' ai.patch
            sed -i '/^> <|im_start|>$/d' ai.patch
            sed -i '/^\[ Prompt: .*\]$/d' ai.patch
            sed -i '/^<|im_start|>$/d' ai.patch
            sed -i '/^<|im_end|>$/d' ai.patch
            sed -i '/^Loading model\./d' ai.patch
            sed -i '/^available commands:/d' ai.patch
            sed -i '/^>$/d' ai.patch

            awk '
              BEGIN { seen = 0 }
              /^diff --git / { seen = 1 }
              seen { print }
            ' ai.patch > ai.patch.filtered
            mv ai.patch.filtered ai.patch

            # ----------------------------------------------------
            # Validation stricte : rejet immédiat si ce n'est pas un diff Git
            # ----------------------------------------------------

            if ! grep -q '^diff --git ' ai.patch; then

              echo "❌ Sortie du modèle non exploitable : aucun diff --git valide."
              cat ai.patch || true

              ERROR_FILE="ai-results/current-error-context.txt"

              {
                echo
                echo "===== PREVIOUS MODEL OUTPUT INVALID ====="
                echo "The model output was rejected because it did not contain a valid unified git diff."
                echo "Only raw diff content starting with 'diff --git ' is accepted."
              } >> "$ERROR_FILE"

              continue
            fi

            if grep -Eq '^(<\|im_start\|>|<\|im_end\|>|\[ Prompt:|Loading model\.|available commands:|> )' ai.patch; then

              echo "❌ Sortie du modèle encore contaminée par le chat/console."
              cat ai.patch

              ERROR_FILE="ai-results/current-error-context.txt"

              {
                echo
                echo "===== PREVIOUS MODEL OUTPUT INVALID ====="
                echo "The model output still contained chat or CLI noise after sanitization."
              } >> "$ERROR_FILE"

              continue
            fi

            # ----------------------------------------------------
            # Retour à la ligne final
            # ----------------------------------------------------

            if [ "$(tail -c1 ai.patch | wc -l)" -eq 0 ]; then
              echo >> ai.patch
            fi

            cp \
              ai.patch \
              "ai-results/patch-$ATTEMPT.patch"

            echo
            echo "===== PATCH PROPOSÉ ====="

            cat ai.patch

            # ----------------------------------------------------
            # Validation Git
            # ----------------------------------------------------

            echo
            echo "===== VALIDATION DU PATCH ====="

            if ! git apply \
              --check \
              --recount \
              --ignore-whitespace \
              ai.patch \
              2> "ai-results/apply-error-$ATTEMPT.txt"
            then

              echo "❌ Patch invalide :"

              cat \
                "ai-results/apply-error-$ATTEMPT.txt"

              # Faire comprendre au modèle pourquoi son patch
              # précédent était invalide.

              {
                echo
                echo "===== PATCH APPLICATION ERROR ====="

                cat \
                  "ai-results/apply-error-$ATTEMPT.txt"

              } >> ai-results/current-error-context.txt

              ERROR_FILE="ai-results/current-error-context.txt"

              continue
            fi

            # ----------------------------------------------------
            # Application
            # ----------------------------------------------------

            git apply \
              --recount \
              --ignore-whitespace \
              ai.patch

            echo
            echo "===== FICHIERS MODIFIÉS ====="

            git status --short

            # ----------------------------------------------------
            # Cargo check
            # ----------------------------------------------------

            echo
            echo "===== CARGO CHECK ====="

            CHECK_FILE="$GITHUB_WORKSPACE/ai-results/cargo-check-$ATTEMPT.txt"

            if (
              cd "$AI_WORKDIR"
              cargo check
            ) > "$CHECK_FILE" 2>&1
            then

              echo
              echo "========================================"
              echo "✅ CORRECTION RÉUSSIE"
              echo "========================================"

              SUCCESS=1

              break

            fi

            # ----------------------------------------------------
            # Nouveau nombre d'erreurs
            # ----------------------------------------------------

            NEW_ERRORS=$(count_errors "$CHECK_FILE")

            echo
            echo "Anciennes erreurs : $PREV_ERRORS"
            echo "Nouvelles erreurs : $NEW_ERRORS"

            echo
            echo "===== CARGO CHECK ====="

            tail -n 100 "$CHECK_FILE"

            # ----------------------------------------------------
            # Pas d'amélioration
            # ----------------------------------------------------

            if [ "$NEW_ERRORS" -ge "$PREV_ERRORS" ]; then

              echo
              echo "↩️ Pas d'amélioration."

              git apply \
                -R \
                --recount \
                --ignore-whitespace \
                ai.patch \
                || git checkout -- .

              # --------------------------------------------------
              # IMPORTANT :
              # même si le patch est annulé, on donne l'erreur
              # au modèle pour qu'il ne répète pas la même chose.
              # --------------------------------------------------

              {
                echo
                echo "===== PREVIOUS PATCH DID NOT IMPROVE CARGO CHECK ====="

                echo "Previous error count: $PREV_ERRORS"
                echo "New error count: $NEW_ERRORS"

                echo
                echo "===== RESULT OF CARGO CHECK ====="

                tail -n 300 "$CHECK_FILE"

              } > ai-results/current-error-context.txt

              ERROR_FILE="ai-results/current-error-context.txt"

            else

              echo
              echo "📉 Amélioration détectée."

              PREV_ERRORS="$NEW_ERRORS"

              ERROR_FILE="$CHECK_FILE"

            fi

          done

          # ======================================================
          # FINAL RESULT
          # ======================================================

          echo
          echo "========================================"

          if [ "$SUCCESS" -eq 1 ]; then

            echo "✅ AI FIX terminé avec succès."

          else

            echo "❌ AI FIX n'a pas réussi à corriger le projet."

          fi

          echo "========================================"

          {
            echo "===== FINAL GIT DIFF ====="

            git diff

            echo

            echo "===== GIT STATUS ====="

            git status --short

          } > ai-results/final-result.txt

          git diff > ai-results/final.patch

          if [ "$SUCCESS" -ne 1 ]; then
            exit 1
          fi

      # ==========================================================
      # UPLOAD RESULTS
      # ==========================================================

      - name: Upload AI results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-fix-results
          path: |
            ai-results/
            ai.patch
            ai-prompt.txt
            ai-results-llama-help.txt