name: Rewrite CI history

on:
  workflow_call:
    inputs:
      confirm:
        description: "Écrire REWRITE-CI pour confirmer la réécriture et le force-push"
        required: true
        type: string
      push:
        description: "Effectuer le force-push après vérification"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Configuration
      # ============================================================

      - name: Vérifier la confirmation
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.confirm }}" != "REWRITE-CI" ]]; then
            echo "::error::Confirmation incorrecte."
            echo "Il faut saisir exactement : REWRITE-CI"
            exit 1
          fi

          echo "[OK] Confirmation validée."

      - name: Installer git-filter-repo
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --user git-filter-repo

          export PATH="$HOME/.local/bin:$PATH"

          git filter-repo --version

      # ============================================================
      # Clone miroir
      # ============================================================

      - name: Cloner tout le dépôt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CLONAGE MIROIR"
          echo "============================================================"

          git clone --mirror \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repo.git

          cd repo.git

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Le clone miroir active origin.mirror=true.
          # On le désactive pour pouvoir utiliser des refspecs explicites.
          git config remote.origin.mirror false

          echo ""
          echo "Remote :"
          git remote -v

          echo ""
          echo "Branches disponibles :"

          git for-each-ref \
            --format='%(refname:short)' \
            refs/heads/

      # ============================================================
      # Sauvegardes
      # ============================================================

      - name: Créer les sauvegardes
        shell: bash
        run: |
          set -euo pipefail

          cd repo.git

          TIMESTAMP="$(date -u '+%Y%m%d-%H%M%S')"

          BACKUP_REPORTS="backup-ci-reports-before-rewrite-${TIMESTAMP}"
          BACKUP_DATABASE="backup-ci-database-before-rewrite-${TIMESTAMP}"

          echo "============================================================"
          echo "CRÉATION DES SAUVEGARDES"
          echo "============================================================"

          if git show-ref --verify --quiet "refs/heads/ci-reports"; then
            git update-ref \
              "refs/heads/${BACKUP_REPORTS}" \
              "refs/heads/ci-reports"

            echo "[OK] ci-reports -> ${BACKUP_REPORTS}"
          else
            echo "[WARN] Branche inexistante : ci-reports"
            BACKUP_REPORTS=""
          fi

          if git show-ref --verify --quiet "refs/heads/ci-database"; then
            git update-ref \
              "refs/heads/${BACKUP_DATABASE}" \
              "refs/heads/ci-database"

            echo "[OK] ci-database -> ${BACKUP_DATABASE}"
          else
            echo "[WARN] Branche inexistante : ci-database"
            BACKUP_DATABASE=""
          fi

          echo "BACKUP_REPORTS=${BACKUP_REPORTS}" >> "$GITHUB_ENV"
          echo "BACKUP_DATABASE=${BACKUP_DATABASE}" >> "$GITHUB_ENV"

          echo ""
          echo "Push des sauvegardes..."

          if [[ -n "$BACKUP_REPORTS" ]]; then
            git push origin \
              "+refs/heads/${BACKUP_REPORTS}:refs/heads/${BACKUP_REPORTS}"
          fi

          if [[ -n "$BACKUP_DATABASE" ]]; then
            git push origin \
              "+refs/heads/${BACKUP_DATABASE}:refs/heads/${BACKUP_DATABASE}"
          fi

          echo ""
          echo "[OK] Sauvegardes envoyées sur GitHub."

      # ============================================================
      # Analyse
      # ============================================================

      - name: Analyser les fichiers à supprimer
        shell: bash
        run: |
          set -euo pipefail

          cd repo.git

          mkdir -p rewrite

          for BRANCH in ci-reports ci-database; do
            echo ""
            echo "============================================================"
            echo "Analyse de ${BRANCH}"
            echo "============================================================"

            if ! git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
              echo "[WARN] Branche inexistante."
              continue
            fi

            case "$BRANCH" in
              ci-reports)
                PREFIX="ci-reports/"
                ;;
              ci-database)
                PREFIX="ci-database/"
                ;;
              *)
                echo "::error::Branche inconnue : ${BRANCH}"
                exit 1
                ;;
            esac

            CURRENT="rewrite/${BRANCH}.current"
            HISTORY="rewrite/${BRANCH}.history"
            DELETE="rewrite/${BRANCH}.delete"

            # --------------------------------------------------------
            # Fichiers présents actuellement
            # --------------------------------------------------------

            git ls-tree \
              -r \
              --name-only \
              "$BRANCH" \
              -- "$PREFIX" \
              | sort -u \
              > "$CURRENT" || true

            # --------------------------------------------------------
            # Tous les fichiers ayant existé dans l'historique
            # --------------------------------------------------------

            git log \
              "$BRANCH" \
              --format= \
              --name-only \
              --diff-filter=ACMR \
              -- "$PREFIX" \
              | sed '/^$/d' \
              | sort -u \
              > "$HISTORY" || true

            # --------------------------------------------------------
            # Fichiers ayant existé mais absents de HEAD
            # --------------------------------------------------------

            comm -23 \
              "$HISTORY" \
              "$CURRENT" \
              > "$DELETE" || true

            echo ""
            echo "Fichiers actuellement présents :"
            wc -l < "$CURRENT"

            echo "Fichiers ayant existé dans l'historique :"
            wc -l < "$HISTORY"

            echo "Fichiers qui seront supprimés de l'historique :"
            wc -l < "$DELETE"

            if [[ -s "$DELETE" ]]; then
              echo ""
              echo "------------------------------------------------------------"
              cat "$DELETE"
              echo "------------------------------------------------------------"
            else
              echo "[OK] Aucun ancien fichier à supprimer."
            fi
          done

      # ============================================================
      # Résumé de l'analyse
      # ============================================================

      - name: Résumé avant réécriture
        shell: bash
        run: |
          set -euo pipefail

          cd repo.git

          echo "============================================================"
          echo "RÉSUMÉ DE L'ANALYSE"
          echo "============================================================"

          for BRANCH in ci-reports ci-database; do
            echo ""
            echo "[${BRANCH}]"

            if [[ -f "rewrite/${BRANCH}.current" ]]; then
              echo "Présents actuellement :"
              wc -l < "rewrite/${BRANCH}.current"
            fi

            if [[ -f "rewrite/${BRANCH}.history" ]]; then
              echo "Présents dans l'historique :"
              wc -l < "rewrite/${BRANCH}.history"
            fi

            if [[ -f "rewrite/${BRANCH}.delete" ]]; then
              echo "À supprimer de l'historique :"
              wc -l < "rewrite/${BRANCH}.delete"
            fi
          done

      # ============================================================
      # Réécriture
      # ============================================================

      - name: Réécrire l'historique
        if: ${{ inputs.push }}
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/bin:$PATH"

          cd repo.git

          for BRANCH in ci-reports ci-database; do
            DELETE="rewrite/${BRANCH}.delete"

            if ! git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
              echo "[WARN] Branche inexistante : ${BRANCH}"
              continue
            fi

            if [[ ! -s "$DELETE" ]]; then
              echo ""
              echo "[OK] Aucun fichier à supprimer pour ${BRANCH}."
              continue
            fi

            echo ""
            echo "============================================================"
            echo "RÉÉCRITURE DE ${BRANCH}"
            echo "============================================================"

            echo ""
            echo "Fichiers supprimés :"
            cat "$DELETE"

            echo ""
            echo "Exécution de git-filter-repo..."

            git filter-repo \
              --force \
              --refs "$BRANCH" \
              --invert-paths \
              --paths-from-file "$DELETE"

            echo ""
            echo "[OK] Historique réécrit pour ${BRANCH}."
          done

      # ============================================================
      # Vérification
      # ============================================================

      - name: Vérifier le résultat
        if: ${{ inputs.push }}
        shell: bash
        run: |
          set -euo pipefail

          cd repo.git

          echo "============================================================"
          echo "VÉRIFICATION APRÈS RÉÉCRITURE"
          echo "============================================================"

          for BRANCH in ci-reports ci-database; do
            if ! git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
              echo "[WARN] Branche inexistante : ${BRANCH}"
              continue
            fi

            DELETE="rewrite/${BRANCH}.delete"

            echo ""
            echo "[${BRANCH}]"

            if [[ ! -s "$DELETE" ]]; then
              echo "[OK] Aucun fichier à vérifier."
              continue
            fi

            # ------------------------------------------------------
            # Vérification dans HEAD
            # ------------------------------------------------------

            while IFS= read -r FILE; do
              [[ -n "$FILE" ]] || continue

              if git ls-tree \
                -r \
                --name-only \
                "$BRANCH" \
                -- "$FILE" \
                | grep -Fxq "$FILE"; then

                echo "::error::Le fichier existe encore dans HEAD : $FILE"
                exit 1
              fi
            done < "$DELETE"

            echo "[OK] Aucun fichier supprimé n'est encore présent dans HEAD."

            # ------------------------------------------------------
            # Vérification de l'historique
            # ------------------------------------------------------

            while IFS= read -r FILE; do
              [[ -n "$FILE" ]] || continue

              if git rev-list \
                "$BRANCH" \
                --objects \
                -- "$FILE" \
                | grep -q .; then

                echo "::error::Le fichier existe encore dans l'historique : $FILE"
                exit 1
              fi
            done < "$DELETE"

            echo "[OK] Aucun fichier supprimé n'est encore présent dans l'historique."
          done

          echo ""
          echo "============================================================"
          echo "TAILLE DU DÉPÔT"
          echo "============================================================"

          git count-objects -vH

      # ============================================================
      # Restaurer origin
      # ============================================================

      - name: Restaurer le remote GitHub
        if: ${{ inputs.push }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd repo.git

          echo "============================================================"
          echo "RESTAURATION DU REMOTE"
          echo "============================================================"

          # git-filter-repo peut supprimer origin.
          git remote remove origin 2>/dev/null || true

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Sécurité : aucun push miroir.
          git config remote.origin.mirror false

          echo ""
          echo "Remote :"
          git remote -v

          echo ""
          echo "Mode mirror :"

          if git config --get remote.origin.mirror >/dev/null 2>&1; then
            git config --get remote.origin.mirror
          else
            echo "false / non défini"
          fi

      # ============================================================
      # Force-push ci-reports
      # ============================================================

      - name: Force-push ci-reports
        if: ${{ inputs.push }}
        shell: bash
        run: |
          set -euo pipefail

          cd repo.git

          if ! git show-ref --verify --quiet "refs/heads/ci-reports"; then
            echo "[WARN] ci-reports inexistante."
            exit 0
          fi

          echo "============================================================"
          echo "FORCE PUSH : ci-reports"
          echo "============================================================"

          git fetch origin \
            refs/heads/ci-reports:refs/remotes/origin/ci-reports

          LOCAL="$(git rev-parse refs/heads/ci-reports)"
          REMOTE="$(git rev-parse refs/remotes/origin/ci-reports)"

          echo "HEAD local   : $LOCAL"
          echo "HEAD distant : $REMOTE"

          git push \
            --force-with-lease="refs/heads/ci-reports:${REMOTE}" \
            origin \
            "refs/heads/ci-reports:refs/heads/ci-reports"

          echo ""
          echo "[OK] ci-reports réécrite."

      # ============================================================
      # Force-push ci-database
      # ============================================================

      - name: Force-push ci-database
        if: ${{ inputs.push }}
        shell: bash
        run: |
          set -euo pipefail

          cd repo.git

          if ! git show-ref --verify --quiet "refs/heads/ci-database"; then
            echo "[WARN] ci-database inexistante."
            exit 0
          fi

          echo "============================================================"
          echo "FORCE PUSH : ci-database"
          echo "============================================================"

          git fetch origin \
            refs/heads/ci-database:refs/remotes/origin/ci-database

          LOCAL="$(git rev-parse refs/heads/ci-database)"
          REMOTE="$(git rev-parse refs/remotes/origin/ci-database)"

          echo "HEAD local   : $LOCAL"
          echo "HEAD distant : $REMOTE"

          git push \
            --force-with-lease="refs/heads/ci-database:${REMOTE}" \
            origin \
            "refs/heads/ci-database:refs/heads/ci-database"

          echo ""
          echo "[OK] ci-database réécrite."

      # ============================================================
      # Résumé final
      # ============================================================

      - name: Résumé
        shell: bash
        run: |
          set -euo pipefail

          cd repo.git

          echo "============================================================"
          echo "RÉSUMÉ FINAL"
          echo "============================================================"

          for BRANCH in ci-reports ci-database; do
            echo ""
            echo "[${BRANCH}]"

            if [[ -f "rewrite/${BRANCH}.delete" ]]; then
              echo "Fichiers supprimés de l'historique :"
              wc -l < "rewrite/${BRANCH}.delete"
            else
              echo "Aucun fichier supprimé."
            fi

            if git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
              echo "HEAD :"
              git rev-parse "refs/heads/${BRANCH}"
            fi
          done

          echo ""
          echo "Push demandé : ${{ inputs.push }}"

          echo ""
          echo "============================================================"
          echo "FIN"
          echo "============================================================"