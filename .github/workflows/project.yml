name: Project Quality

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

  

env:
  DOC_SCORE_MINIMUM: 60
  GH_TOKEN: ${{ github.token }}
    
  

jobs:

  documentation-check:

    name: 📚 Project Quality
    runs-on: ubuntu-latest
    steps:

      # =========================
      # Checkout
      # =========================

      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      # =========================
      # Node.js
      # =========================

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 📦 Install Node tools
        run: |
          npm install -g markdownlint-cli2
          npm install -g cspell

      # =========================
      # Python
      # =========================

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install interrogate markdown pyyaml

      # =========================
      # Rust
      # =========================

      - name: 🦀 Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
         
              # =========================
      # Markdown
      # =========================

      - name: 📑 Check Markdown
        continue-on-error: true
        run: |
           mkdir -p reports/project
           markdownlint-cli2 \
           "**/*.md" --json \
           > reports/project/markdownlint.json
      # =========================
      # Spelling
      # =========================

      - name: ✍️ Check spelling
        continue-on-error: true
        run: |
          mkdir -p reports/project
          
          cspell "**/*.md" \
          --language-id markdown \
          --no-progress \
          --no-summary \
          --output-format json \
          > reports/project/cspell.txt 2>&1

      # =========================
      # Links
      # =========================

      - name: 🔗 Check links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            **/*.md

      # =========================
      # Python documentation
      # =========================

      - name: 🐍 Generate Python documentation report
        continue-on-error: true
        run: |
          mkdir -p reports/project

          interrogate . \
           -o markdown \
           -p reports/project/python-docs.md \
           -f "$DOC_SCORE_MINIMUM"

      # =========================
      # Rust documentation
      # =========================

      - name: 🦀 Generate Rust documentation
        continue-on-error: true
        run: |
          if [ -f Cargo.toml ]; then
            cargo doc --no-deps
          fi
                # =========================
      # Documentation score
      # =========================

      - name: 📊 Calculate project score
        run: |
          
          python scripts/transformateur.py
          mkdir -p reports/project

          python scripts/docs_score.py

      # =========================
      # Display score
      # =========================

      - name: 📋 Show  score
        run: |

          echo "Documentation score :"

          cat reports/project/score.txt

          echo ""

          cat reports/project/score.md

      # =========================
      # Verify score
      # =========================

      - name: 🚨 Verify project quality
        run: |

          SCORE=$(cat reports/project/score.txt)

          echo "Quality score : $SCORE/100"

          if [ "$SCORE" -lt "$DOC_SCORE_MINIMUM" ]; then

            echo ""
            echo "========================================"
            echo "❌  QUALITY TEST FAILED"
            echo "========================================"
            echo ""
            echo "Obtained score : $SCORE/100"
            echo "Minimum score : $DOC_SCORE_MINIMUM/100"
            echo ""
            echo "See reports/project/problems.md"
            echo ""

            exit 1

          fi

          echo ""
          echo "========================================"
          echo "✅  QUALITY TEST PASSED"
          echo "========================================"
          echo ""
          echo "Score : $SCORE/100"

      # =========================
      # GitHub Step Summary
      # =========================

      - name: 📝 Publish summary
        if: always()
        run: |
          mkdir -p reports/project
          {
            echo "# 📚 Project Quality"
            echo ""
            echo "Score : $(cat reports/project/score.txt)/100"
            echo ""
            echo "## Details"
            echo ""
            cat reports/project/score.md
          } >> $GITHUB_STEP_SUMMARY
          python -m scripts.generate_problems_md
                
        
      - name: 💾 Commit reports
        if: always()
        run: |
                git config --global user.name "github-actions"
                git config --global user.email "github-actions@github.com"
                export GH_TOKEN="${{ github.token }}"
                git fetch origin
                if git show-ref --verify --quiet refs/remotes/origin/ci-reports
                then
                git worktree add /tmp/ci-worktree origin/ci-reports
                else
                git worktree add -b ci-reports /tmp/ci-worktree
                fi
                
                mkdir -p "/tmp/ci-worktree/reports/rust"
                rsync -a --delete   "$GITHUB_WORKSPACE/reports/project/"   "/tmp/ci-worktree/reports/project/" 2>/dev/null || true
                cd /tmp/ci-worktree
                git add -A
                git status
                if git diff --cached --quiet; then
                echo "No changes to commit."
                cd "$GITHUB_WORKSPACE"
                git worktree remove /tmp/ci-worktree --force && rm -rf "/tmp/ci-worktree/reports/project"
                exit 0
                fi
                git commit -m "Report project"
                for i in 1 2 3
                do
                echo "Tentative $i/3"
                git fetch origin 
                echo "Branche actuelle :"
                git branch --show-current

                git status

                if git push origin HEAD:ci-reports
                then
                echo "Push réussi"
                cd "$GITHUB_WORKSPACE"
                git worktree remove /tmp/ci-worktree --force && rm -rf "/tmp/ci-worktree/reports/project"
                exit 0
                fi

                echo "Push échoué."
                sleep 2
                done

                echo "======================================"
                echo "Push direct impossible"
                echo "Création de la branche de secours"
                echo "======================================"

                FALLBACK_BRANCH="ci-reports-update"
                echo "Branche de secours : $FALLBACK_BRANCH"

                # Crée ou met à jour la branche de secours
                git push --force origin HEAD:"refs/heads/$FALLBACK_BRANCH"
                echo "Branche de secours poussée."

                # Vérifie si une PR existe déjà
                PR_URL=$(gh pr list \
                --base "ci-reports" \
                --head "$FALLBACK_BRANCH" \
                --state open \
                --json url \
                --jq '.[0].url')
                if [ -n "$PR_URL" ]; then
                echo "Une Pull Request existe déjà : $PR_URL"
                else
                echo "Création de la Pull Request..."

                PR_URL=$(gh pr create \
                --base ci-reports \
                --head "$FALLBACK_BRANCH" \
                --title "Report project "\
                --body "Le push direct vers \`ci-reports\` a échoué après 3 tentatives. Les changements générés par GitHub Actions sont     disponibles dans cette Pull Request.")
                fi
                gh pr merge "$PR_URL" \
                --auto \
                --squash

                cd "$GITHUB_WORKSPACE"
                git worktree remove /tmp/ci-worktree --force && rm -rf /tmp/ci-worktree/reports/project


      


      
