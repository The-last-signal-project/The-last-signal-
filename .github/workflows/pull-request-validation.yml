name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prep:
    name: preparation
    runs-on: ubuntu-latest
    
    env:
     DEPLOY_KEY: ${{ secrets.CI_SYNC_DEPLOY_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          ssh-key: ${{ env.DEPLOY_KEY }}  
      - name: update cargo vendor
        working-directory: server_rust
        run: | 
             set -euxo pipefail
             
             rm -rf vendor
             rm -f Cargo.lock
             rm -rf .cargo
             cargo update
             cargo vendor vendor
                        
             mkdir -p .cargo
             echo '[build]' > .cargo/config.toml
             echo 'incremental = true' >> .cargo/config.toml
             echo '' >> .cargo/config.toml
             echo '[source.crates-io]' >> .cargo/config.toml
             echo 'replace-with = "vendored-sources"' >> .cargo/config.toml
             echo '' >> .cargo/config.toml
             echo '[source.vendored-sources]' >> .cargo/config.toml
             echo 'directory = "vendor"' >> .cargo/config.toml
             git config user.name github-actions
             git config user.email github-actions@github.com
             git remote set-url origin \
               git@github.com:The-last-signal-project/The-last-signal-.git
             git remote -v
             
             

             git add vendor Cargo.lock .cargo/config.toml
             git stash --staged
             git fetch origin main
             git reset --hard origin/main
             if git stash list | grep -q '^stash@{0}:'
             then
             
             echo "stash@{0} trouvé → application"
             git stash pop stash@{0} || true
             
             else
             echo "stash@{0} inexistant → aucune action"
             fi
             
             if git diff --name-only --diff-filter=U | grep -q .; then
             echo "⚠️ Conflits détectés"
             git checkout --ours .
             git add -A
             echo "✅ Conflits résolus avec ours"
             else
             echo "✅ Aucun conflit"
             fi
             git add -A
             git diff --cached --quiet || git commit -m "chore: update Cargo vendor"
             
             
             git push origin main --force-with-lease


  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    needs:
        - prep
    env:
     DEPLOY_KEY: ${{ secrets.CI_SYNC_DEPLOY_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          ssh-key: ${{ env.DEPLOY_KEY }}    
    
    
      

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest tests/ --ignore=tests/security

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    needs:
       - prep
   
    env:
      DEPLOY_KEY: ${{ secrets.CI_SYNC_DEPLOY_KEY }}
      DATABASE_PATH: ${{ github.workspace }}/database
      DATABASE_URL: sqlite:${{ github.workspace }}/database/the_last_signal.db
      DATABASE_TEST_PATH: ${{ github.workspace }}/database-test
      DATABASE_TEST_URL: sqlite:${{ github.workspace }}/database-test/the_last_signal.db
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          ssh-key: ${{ env.DEPLOY_KEY }}
    
      

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      
      - name: Prepare local test database directories
        run: |
          mkdir -p "$DATABASE_PATH" "$DATABASE_TEST_PATH"

      - name: Run Rust tests
        working-directory: server_rust
        run: cargo test 
