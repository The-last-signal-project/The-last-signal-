name: Update Repository Statistics

on:
  workflow_call:
   secrets:
      DEPLOY_KEY:
        required: true
  
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Generate statistics card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Save updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            git@github.com:The-last-signal-project/The-last-signal-.git
          git remote -v
          git add stats/repository-stats.svg
          git stash --staged
          git fetch origin main
          git reset --hard origin/main
          if git stash list | grep -q '^stash@{0}:'
          then
          echo "stash@{0} trouvé → application"
          git stash pop stash@{0}
          git add -A
          else
          echo "stash@{0} inexistant → aucune action"
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
          echo "⚠️ Conflits détectés"
          git checkout --ours .
          git add -u
          echo "✅ Conflits résolus avec ours"
          else
          echo "✅ Aucun conflit"
          fi
          git diff --cached --quiet || git commit -m "stats update"
             
          git push origin main --force-with-lease
          
