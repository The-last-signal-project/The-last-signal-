name: SQLite Search

on:
  workflow_dispatch:
    inputs:
      database:
        description: "Chemin de la base SQLite"
        required: true
        default: "database/the_last_signal.db"

      table:
        description: "Table (laisser vide = toutes)"
        required: false
        default: ""

      search:
        description: "Texte à rechercher"
        required: true

      output:
        description: "Nom du fichier de sortie (sans extension)"
        required: false
        default: "search_report"

      format:
        description: "Format du rapport"
        required: true
        type: choice
        options:
          - txt
          - md
          - json
          - csv
          
        default: txt

permissions:
  contents: write

jobs:
  search:
      
      runs-on: ubuntu-latest
    

      steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
              fetch-depth: 0
              token: ${{ secrets.GITHUB_TOKEN }}
              persist-credentials: true
      
      
  

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Lancer la recherche
        shell: bash
        run: |
          CMD="python scripts/recherche.py"

          CMD="$CMD --database '${{ inputs.database }}'"
          CMD="$CMD --search '${{ inputs.search }}'"

          if [ -n "${{ inputs.table }}" ]; then
            CMD="$CMD --table '${{ inputs.table }}'"
          fi

          if [ -n "${{ inputs.output }}" ]; then
            CMD="$CMD --output '${{ inputs.output }}.${{ inputs.format }}'"
            CMD="$CMD --format '${{ inputs.format }}'"
          fi

          echo "Commande exécutée :"
          echo "$CMD"

          eval "$CMD"
      

      
      - name: Upload du rapport
        if: inputs.output != ''
        uses: actions/upload-artifact@v7
        with:
          name: sqlite-search-report
          path: ${{ inputs.output }}.${{ inputs.format }}
