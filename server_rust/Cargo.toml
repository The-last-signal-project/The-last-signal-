[package]
name = "the-last-signal-server"
version = "1.0.13"
edition = "2024"

[profile.dev]
opt-level = 0
debug = 2
incremental = true
[dependencies]
fernet = "0.2"
argon2 =  "0.6.0"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.10" 
serde_json = "1.0"
log = "0.4"
flexi_logger = "0.31"
flate2 = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "sqlite",
    "uuid",
    "macros"
] }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "net",
    "time",
    "sync"
] }

